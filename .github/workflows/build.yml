name: HK-Auto-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build Elite APK (Bypassing Global Gradle Engine)
        working-directory: ./HK-Browser
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        
      - name: Upload HK Payload
        uses: actions/upload-artifact@v4
        with:
          name: HK-Browser-APK
          path: HK-Browser/**/*.apk
