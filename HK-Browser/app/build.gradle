plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hk'
    compileSdk 34

    defaultConfig {
        applicationId "com.hk"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    // HK-OPERATION: CORE SYSTEM ARMOR (Prevents mutation crash)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // 👉 HK-OPERATION: NATIVE GOOGLE AUTH UPLINK (The Ultimate Bypass)
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    
    // SwipeRefreshLayout library destroyed for flawless mall scrolling!
}
